name: Deploy web (GitHub Pages)

on:
  push:
    branches: [main, master]
    paths:
      - 'www/**'
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'update.json'
      - 'manifest.json'
      - 'icons/**'
      - 'sw.js'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync source → www
        run: |
          mkdir -p www/js www/css www/icons
          cp -f index.html www/index.html 2>/dev/null || true
          cp -f update.json www/update.json 2>/dev/null || true
          cp -f manifest.json www/manifest.json 2>/dev/null || true
          cp -f sw.js www/sw.js 2>/dev/null || true
          cp -f js/*.js www/js/ 2>/dev/null || true
          cp -f css/*.css www/css/ 2>/dev/null || true
          cp -rf icons/* www/icons/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
